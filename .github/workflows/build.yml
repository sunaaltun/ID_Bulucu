name: Build EXE
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask requests pyinstaller
      - run: pyinstaller --onefile --name id_bulucu id_bulucu.py
      - uses: actions/upload-artifact@v4
        with:
          name: id_bulucu-exe
          path: dist/id_bulucu.exe
